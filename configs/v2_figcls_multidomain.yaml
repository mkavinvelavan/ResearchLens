# V2-MD - ViT figure-type classifier on SPIQA (computer science) + BIOMEDICA (biomedical, PubMed Central) figures
# Same settings as the SPIQA-only ViT, so the only change is the training data.
model_name: google/vit-base-patch16-224-in21k
model_tag: v2_figcls
run_name: vit_multidomain
data_dir: /content/data/figs_multidomain
epochs: 6
lr: 5.0e-5
batch_size: 32
warmup_ratio: 0.1
weight_decay: 0.05
label_smoothing: 0.1
hidden_dropout: 0.1
attention_dropout: 0.0
early_stopping_patience: 3
num_workers: 2
hub_repo: researchlens-vit-figure-type-multidomain
