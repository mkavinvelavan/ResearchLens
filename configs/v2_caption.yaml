# V2 text branch - SciBERT figure-type classifier from captions only (same figures as the ViT)
model_name: allenai/scibert_scivocab_uncased
model_tag: v2_figcls
run_name: scibert_caption
data_dir: /content/data/spiqa_figs
epochs: 4
lr: 3.0e-5
batch_size: 32
max_length: 128
weight_decay: 0.05
hidden_dropout: 0.2
attention_dropout: 0.1
freeze_embeddings: true
label_smoothing: 0.1
early_stopping_patience: 2
hub_repo: researchlens-scibert-caption-figure-type
